name: Monitor Workana

on:
  # Main schedule lives in scheduler/wrangler.jsonc: a Cloudflare Worker calls
  # workflow_dispatch every 15 min, since GitHub's own schedule is delayed/dropped.
  # This hourly cron is only a fallback in case the Worker stops (e.g. expired
  # token); extra runs are harmless because seen.json deduplicates projects.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Under the 15-min dispatch interval; bot.py's PROPOSAL_* limits are sized to fit it
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: bot.py

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bot.py') }}

      - name: Install Chromium
        run: |
          version=$(grep -oP '"playwright==\K[0-9.]+' bot.py)
          uv run --with "playwright==$version" playwright install --with-deps chromium

      - name: Install Claude Code
        # Pinned: the bot relies on this version's flags and JSON output
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT_KEY: ${{ secrets.PROMPT_KEY }}
          PRICE_HOURLY_RATE: ${{ secrets.PRICE_HOURLY_RATE }}
          PRICE_MIN_PROJECT: ${{ secrets.PRICE_MIN_PROJECT }}
        run: uv run --script bot.py

      - name: Save seen projects
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json pending.json rejected.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update seen projects"
          # a push made during this run would otherwise reject ours and lose sent projects
          git pull --rebase
          git push
