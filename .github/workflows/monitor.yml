name: Monitor Workana

on:
  # Main schedule lives in scheduler/wrangler.jsonc: a Cloudflare Worker calls
  # workflow_dispatch every 15 min, since GitHub's own schedule is delayed/dropped.
  # This hourly cron is only a fallback in case the Worker stops (e.g. expired
  # token); extra runs are harmless because proposta/data/seen.json deduplicates projects.
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read # state goes to the proposta repo, pushed with its deploy key
  actions: write # gh workflow run proposal.yml

concurrency:
  # proposal.yml writes data/pending.json too: one run at a time avoids rebase conflicts
  group: proposta-repo
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Under the 15-min dispatch interval; bot.py's TRIAGE_DEADLINE_SECONDS is sized to fit it
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v7

      - name: Checkout proposta repo
        # State lives there: without it bot.py exits with 1 instead of alerting every job again
        uses: actions/checkout@v7
        with:
          repository: leandrorochaadm/proposta
          ssh-key: ${{ secrets.PROPOSTA_DEPLOY_KEY }}
          path: proposta

      - name: Configure git author
        working-directory: proposta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: bot.py

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bot.py') }}

      - name: Install Chromium
        run: |
          version=$(grep -oP '"playwright==\K[0-9.]+' bot.py)
          uv run --with "playwright==$version" playwright install --with-deps chromium

      - name: Connect Cloudflare WARP
        # Workana's Cloudflare blocks GitHub's datacenter IPs; WARP's proxy mode routes only
        # the browser through a consumer IP. If it fails the bot still runs without a proxy.
        # bot.py's TRIAGE_DEADLINE_SECONDS leaves room for this timeout
        continue-on-error: true
        timeout-minutes: 2
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp
          until warp-cli --accept-tos status >/dev/null 2>&1; do sleep 1; done
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos proxy port 40000
          warp-cli --accept-tos connect
          until warp-cli --accept-tos status | grep -q Connected; do sleep 1; done
          trace=$(curl -fsS --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace)
          grep -E '^(ip|warp)=' <<<"$trace"
          grep -qx 'warp=on' <<<"$trace"
          echo "BROWSER_PROXY=socks5://127.0.0.1:40000" >> "$GITHUB_ENV"

      - name: Install Claude Code
        # Pinned: the bot relies on this version's flags and JSON output
        run: npm install -g @anthropic-ai/claude-code@2.1.282

      - name: Run bot
        id: bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEYWORDS: ${{ vars.KEYWORDS }}
          EXCLUDE_KEYWORDS: ${{ vars.EXCLUDE_KEYWORDS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run --script bot.py monitor

      - name: Upload debug page
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-page
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save state
        if: always()
        working-directory: proposta
        run: |
          git add data/seen.json data/pending.json data/rejected.json
          git diff --cached --quiet || git commit -m "chore: update seen projects"
          # a push made meanwhile (e.g. a hand edit) would otherwise reject ours and lose sent projects
          git pull --rebase
          git push

      - name: Dispatch proposal
        # The dispatched run waits for this one in the proposta-repo concurrency group
        if: always() && steps.bot.outputs.has_queue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run proposal.yml
