name: Claude Usage

# Manual only: sends the plan's 5h window and weekly usage to Telegram
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Send usage report
        env:
          # Usage goes to @leandro_claude_notify_bot, not to the job alerts bot.
          # A private chat id is the user id, so it falls back to the main chat id.
          TELEGRAM_TOKEN: ${{ secrets.USAGE_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.USAGE_TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run --script usage_report.py
